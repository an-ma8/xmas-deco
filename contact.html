<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--viewpoint fits the page to the screen. content=width is auto fit to size of screen-->
    <meta name="description" content="Bring your Christmas vision to life with inspiring décor ideas for every style and celebration."> <!--blurb that appears in search engine-->
    <title>Christmas decorating | Contact</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/contact.css">
</head>

<body>
    <header>
        <h1> Christmas decorating</h1>
        <input id="hamburger_checkbox" type="checkbox"> 
        <label for="hamburger_checkbox" id="hamburger_icon">
              <img src="images/hamburger_menu.png" alt="Menu" width="60" height="60"> <!--Size of Gold Gift box used as Menu icon-->
            <span class="sr-only"> Toggle navigation</span> <!--toggle is showing atm, it will be hidden with css-->
        </label>
        <nav>
            <a href="index.html">Home</a>
            <a href="photos.html">Photos</a>
            <a href="about.html">About</a>
            <a class="active_nav" href="contact.html">Contact</a>
        </nav>
    </header>

<form>
   
    <h2> Be a part of the festive fun:</h2>
    <label for="name">Your Name</label>
    <input type="text" id="name" name="name" placeholder="Enter your name here">
        
    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="Enter your email">

    <label for="phone">Phone Number</label>
    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">

    <label for="message">Message:</label>
    <textarea id="message" name="message" rows="6" placeholder="Type in your message here"></textarea>
    <button type="submit">Send Santa's Helpers Your Message</button>

</form>

<footer>
        <p>Thank you for visiting!</p>
</footer>
</body>
</html>
